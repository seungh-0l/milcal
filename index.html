<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>군생활 일정 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* 레이아웃: 상단 요약(전역 카운트) → 탭(달력 / 휴가·출타) → 한 달 달력 + 선택한 날 일정. 휴대폰 한 손 조작 기준. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#1b211d; --muted:#667068; --line:#dbe0da;
  --accent:#2f6b4f; --accent-ink:#ffffff; --red:#d23b3b; --blue:#2563c9; --warn-bg:#fdecec;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --h-leave:#2f9e63; --h-wout:#0f9aa8; --h-combat:#d08a12; --h-train:#5b6b7a; --h-night:#8a4fd1;
  --h-hosp:#d6558c; --h-out:#2f7fd6; --h-stay:#4a55c8; --h-duty:#8a6a45; --h-etc:#7d8580;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121614; --surface:#1b211e; --ink:#e9eeea; --muted:#96a199; --line:#2e3732;
    --accent:#58b488; --accent-ink:#0c1410; --red:#ff6b6b; --blue:#6aa5ff; --warn-bg:#3a1d1d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614; --surface:#1b211e; --ink:#e9eeea; --muted:#96a199; --line:#2e3732;
  --accent:#58b488; --accent-ink:#0c1410; --red:#ff6b6b; --blue:#6aa5ff; --warn-bg:#3a1d1d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.num{font-variant-numeric:tabular-nums}

/* 요약 */
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sum-top .lbl{color:var(--muted);font-size:13px}
.dday{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.dday small{font-size:16px;font-weight:600;margin-left:2px}
.pct{font-size:22px;font-weight:700;text-align:right}
.pct span{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px}
.tile b{display:block;font-size:20px;font-weight:700}
.tile span{font-size:12px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);margin-top:10px}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:9px 2px;font-size:14px;white-space:nowrap;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}

/* 달력 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:700;font-size:16px}
.nav{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:18px}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px;font-weight:600}
.sun{color:var(--red)!important}.sat{color:var(--blue)!important}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);min-height:86px}
.cell{border:0;background:transparent;border-radius:8px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;overflow:hidden;min-width:0}
.cell.out{opacity:.4}
.cell.sel{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cell .d{font-weight:700;font-size:14px;line-height:20px;min-width:22px;height:20px;border-radius:99px;text-align:center;padding:0 3px}
.cell.today .d{background:var(--accent);color:var(--accent-ink)!important}
.cell .hn{font-size:9px;color:var(--red);line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.evbar{--h:var(--h-etc);pointer-events:none;z-index:1;font-size:10px;line-height:15px;height:17px;margin:1px 2px;padding:0 4px;border-radius:5px;white-space:nowrap;overflow:hidden;
  background:color-mix(in srgb,var(--h) 26%,var(--surface));border:1px solid color-mix(in srgb,var(--h) 60%,var(--surface))}
.evbar.hope{background:transparent;border-style:dashed}
.evbar.cl{margin-left:0;border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.evbar.cr{margin-right:0;border-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.chip{--h:var(--h-etc);font-size:10px;line-height:1.25;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;
  background:color-mix(in srgb,var(--h) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--h) 60%,var(--surface))}
.chip.hope{background:transparent;border-style:dashed}
.t-leave{--h:var(--h-leave)}.t-wout{--h:var(--h-wout)}.t-combat{--h:var(--h-combat)}.t-training{--h:var(--h-train)}
.t-night{--h:var(--h-night)}.t-hospital,.t-rx{--h:var(--h-hosp)}.t-out{--h:var(--h-out)}.t-stay{--h:var(--h-stay)}
.t-duty{--h:var(--h-duty)}.t-etc{--h:var(--h-etc)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend .chip{font-size:11px;padding:1px 6px;color:var(--ink)}

/* 선택한 날 */
.day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.day-head h2{margin:0;font-size:17px}
.day-head .sub{font-size:12px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.ev{--h:var(--h-etc);border-left:4px solid var(--h);padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--h) 9%,var(--surface));display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev + .ev{margin-top:6px}
.ev b{display:block}
.ev p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.ev .acts{display:flex;gap:4px;flex-shrink:0}
.ev .acts button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:99px;border:1px solid var(--line);margin-left:4px;vertical-align:1px}
.pill.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.none{color:var(--muted);font-size:14px;margin:4px 0}

/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:12px}
.field > label,.field > .lab{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.field textarea{min-height:64px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:5px 9px;font-size:13px}
.fixed{padding:9px 10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rows{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow .dt{width:76px;font-weight:600;font-size:13px;flex-shrink:0}
.drow input{flex:1;min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.drow .lnote,.drow select{flex:1 1 100%;margin-left:84px}
@media (min-width:520px){.drow .lnote,.drow select{flex:1 1 140px;margin-left:0}}
.err{background:var(--warn-bg);color:var(--red);font-weight:700;border-radius:9px;padding:9px 11px;margin-bottom:12px}
.err small{display:block;font-weight:500}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end}

/* 관리 */
h2.sec{margin:0 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left;font-weight:600}
td input{width:56px;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.meter{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:0}
.hol{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.addhol{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:10px}
.addhol input{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
#view-mng,#view-rev{display:flex;flex-direction:column;gap:14px}
.glist{margin-top:10px;border-top:1px solid var(--line)}
.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.grow .gn{font-weight:600;word-break:break-word}
.grow .gk{font-size:12px;color:var(--muted);margin-left:4px;font-weight:500}
.grow .gr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.grow .gu{font-size:13px}
.pill.plan{border-style:dashed}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.drow select{flex:1 1 140px;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big span{font-size:14px;color:var(--muted);font-weight:500}
.subline{color:var(--muted);font-size:13px;margin:4px 0 10px}
td.sub{padding-left:14px;font-weight:500!important;font-size:13px;color:var(--muted)}
.seg.rb button{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;font-size:13px}
.seg.rb i{width:12px;height:12px;border-radius:99px;background:var(--c);display:inline-block}
.seg.rb button[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--bg));border-color:var(--c);color:var(--ink)}
body.ro #add-btn,body.ro .acts,body.ro .gbtns,body.ro [data-gedit],body.ro #settings{display:none!important}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="summary" aria-label="전역 요약"></section>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-cal" data-tab="cal" aria-selected="true">달력</button>
    <button role="tab" id="tab-mng" data-tab="mng" aria-selected="false">휴가·출타 관리</button>
    <button role="tab" id="tab-rev" data-tab="rev" aria-selected="false">군생활 돌아보기</button>
  </div>
  <div id="view-cal">
    <section class="card" id="calendar"></section>
    <section class="card" id="day" style="margin-top:14px"></section>
  </div>
  <div id="view-mng" hidden></div>
  <div id="view-rev" hidden></div>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="application/json" id="seed">null</script>
<script id="app">
(function(){
"use strict";
var HOL={'2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절','2027-01-01':'신정','2027-02-06':'설 연휴','2027-02-07':'설날','2027-02-08':'설 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일','2028-01-01':'신정'};
var FIRST='2026-07', LAST='2028-01';
var DOW=['일','월','화','수','목','금','토'];
var KINDS=['연가','위로','포상','청원'];
var OUTK=['정기','포상','위로'];
var RAINBOW=[['red','빨강','#e5484d'],['orange','주황','#f2802b'],['yellow','노랑','#e8b913'],['green','초록','#30a46c'],['blue','파랑','#3b82f6'],['indigo','남색','#4b4fc4'],['violet','보라','#9b51e0']];
function rbHex(k){for(var i=0;i<RAINBOW.length;i++)if(RAINBOW[i][0]===k)return RAINBOW[i][2];return ''}
function hStyle(e){var c=e&&e.type==='etc'&&rbHex(e.color);return c?' style="--h:'+c+'"':''}
var TYPE_NAME={leave:'휴가',wout:'평일외출',combat:'전투휴무',training:'훈련',hospital:'병원',etc:'기타',out:'외출',stay:'외박',duty:'근무'};
var WEEKDAY_TYPES=['leave','wout','combat','hospital','etc'];
var WEEKEND_TYPES=['leave','out','stay','duty'];
var LS='milcal-state-v1';

/* ---------- 날짜 ---------- */
function pad(n){return (n<10?'0':'')+n}
function toNum(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function fromNum(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(s,n){return fromNum(toNum(s)+n)}
function dow(s){return new Date(toNum(s)*864e5).getUTCDay()}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function md(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])}
function mdw(s){return md(s)+' ('+DOW[dow(s)]+')'}
function range(a,b){var r=[],x=toNum(a),y=toNum(b);for(;x<=y;x++)r.push(fromNum(x));return r}
function ym(s){return s.slice(0,7)}
function quarter(s){return s.slice(0,4)+'-Q'+(Math.floor((+s.slice(5,7)-1)/3)+1)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- 상태 ---------- */
function blank(){return {v:1,updatedAt:0,settings:{enlist:'2026-07-06',discharge:'2028-01-05'},customHolidays:[],
  grants:[],events:[]}}
function gid(){return 'g'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36)}
function normalize(s){var b=blank();if(!s||typeof s!=='object')return b;
  b.updatedAt=s.updatedAt||0;
  if(s.settings){b.settings.enlist=s.settings.enlist||b.settings.enlist;b.settings.discharge=s.settings.discharge||b.settings.discharge}
  if(Array.isArray(s.customHolidays))b.customHolidays=s.customHolidays;
  if(Array.isArray(s.grants))b.grants=s.grants.filter(function(g){return g&&g.id&&g.pool});
  else{ /* 이전 버전(숫자 입력) 이전 */
    function mk(pool,E,P){if(+E>0)b.grants.push({id:gid(),pool:pool,name:'기존 보유',days:+E,plan:false});if(+P>0)b.grants.push({id:gid(),pool:pool,name:'기존 예정',days:+P,plan:true})}
    ['위로','포상','청원'].forEach(function(k){if(s.leave&&s.leave[k])mk('leave:'+k,s.leave[k].earned,s.leave[k].planned)});
    mk('combat',s.combatEarned,s.combatPlan);
    ['out','stay'].forEach(function(t){mk('reward:'+t,s.reward&&s.reward[t],s.rewardPlan&&s.rewardPlan[t])});
  }
  if(Array.isArray(s.events))b.events=s.events.filter(function(e){return e&&e.type!=='training'});
  autoAssign(b);
  return b}
/* 항목이 지정되지 않은 사용분을 보유 → 예정 순으로 채움 */
function autoAssign(st){
  var byId={},use={};st.grants.forEach(function(g){byId[g.id]=g;use[g.id]=0});
  function ok(id,pool){return id&&byId[id]&&byId[id].pool===pool}
  var evs=st.events.slice().sort(function(a,b){return (a.start||a.date)<(b.start||b.date)?-1:1});
  evs.forEach(function(e){
    if(e.type==='leave'){e.gr=e.gr||{};for(var d in e.gr){var k=e.days&&e.days[d];if(!k||k==='연가'||!ok(e.gr[d],'leave:'+k))delete e.gr[d];else use[e.gr[d]]++}}
    else if(e.type==='combat'||((e.type==='out'||e.type==='stay')&&e.kind==='포상')){var p=e.type==='combat'?'combat':'reward:'+e.type;if(ok(e.gr,p))use[e.gr]++;else delete e.gr}
    else delete e.gr;
  });
  function pick(pool){var gs=st.grants.filter(function(g){return g.pool===pool}).sort(function(a,b){return (a.plan?1:0)-(b.plan?1:0)});
    for(var i=0;i<gs.length;i++)if(use[gs[i].id]<gs[i].days){use[gs[i].id]++;return gs[i].id}return ''}
  evs.forEach(function(e){
    if(e.type==='leave'){for(var d in e.days){if(e.days[d]!=='연가'&&!e.gr[d]){var x=pick('leave:'+e.days[d]);if(x)e.gr[d]=x}}}
    else if(e.type==='combat'||((e.type==='out'||e.type==='stay')&&e.kind==='포상')){if(!e.gr){var y=pick(e.type==='combat'?'combat':'reward:'+e.type);if(y)e.gr=y}}
  });

var LOCK={"s":"4spwiZYQ4FK+F8BD0kMQzQ==","i":"c9EbSnGfpSaQlI+J","c":"rfZiTL8r9zzvhsZApSv+AvaJS6UYYWg5/guw15LnPFlCa4vkg30Touq5DudViALosClx+4i+ah8jm7RFWt5IIayGw3I5f5ElXm6ZMEtFjHAJ/ek3AGDJxkyyLnz/KXVuNcFuvTf3C1f9r/UtOg==","n":600000};

function grantsOf(pool){return S.grants.filter(function(g){return g.pool===pool}).sort(function(a,b){return (a.plan?1:0)-(b.plan?1:0)})}
function grantById(id){for(var i=0;i<S.grants.length;i++)if(S.grants[i].id===id)return S.grants[i];return null}
function gUse(id,exId){var u=0,c=0;
  S.events.forEach(function(e){if(e.id===exId)return;
    if(e.type==='leave'){for(var d in (e.gr||{}))if(e.gr[d]===id){u++;if(e.status!=='희망')c++}}
    else if(e.gr===id){u++;if(e.status!=='희망')c++}});
  return {u:u,c:c,h:u-c}}
function formUse(id,skipDay){if(!F)return 0;if(F.type==='leave'){var n=0;for(var d in (F.gr||{}))if(d!==skipDay&&F.gr[d]===id&&F.days[d]&&F.days[d]!=='연가')n++;return n}return F.gr===id?1:0}

  for(var i=0;i<gs.length;i++)if(gs[i].days-gUse(gs[i].id,F.id).u-formUse(gs[i].id,skipDay)>0)return gs[i].id;

function stats(){
  var en=toNum(S.settings.enlist),di=toNum(S.settings.discharge),t=toNum(T);
  var total=Math.max(1,di-en),remain=Math.max(0,di-t),elapsed=Math.min(total,Math.max(0,t-en));

function buildIndex(){
  var idx={};function put(d,o){(idx[d]=idx[d]||[]).push(o)}

    var hope=e.status==='희망';
    if(e.type==='training'){evDates(e).forEach(function(d){var night=(e.details&&e.details[d]||'').indexOf('철야')>=0;put(d,{cls:night?'t-night':'t-training',label:night?'철야':'훈련',e:e})})}
    else if(e.type==='leave')evDates(e).forEach(function(d){put(d,{cls:'t-leave',label:'휴가',hope:hope,e:e})});
    else if(e.type==='stay'){put(e.date,{cls:'t-stay',label:'외박',hope:hope,e:e});put(addDays(e.date,1),{cls:'t-stay',label:'외박',hope:hope,e:e})}
    else if(e.type==='hospital'){put(e.date,{cls:'t-hospital',label:'병원',e:e});if(e.rxDays>0)put(addDays(e.date,e.rxDays),{cls:'t-rx',label:'약 끝',hope:true,e:e,rx:true})}
    else if(e.type==='etc')evDates(e).forEach(function(d){put(d,{cls:'t-etc',label:etcLabel(e),e:e})});
    else put(e.date,{cls:'t-'+e.type,label:{wout:'평외',combat:'전휴',out:'외출',duty:'근무'}[e.type],hope:hope,e:e});
  });
  return idx;
}

function statusPill(e){return e.status?'<span class="pill'+(e.status==='확정'?' ok':'')+'">'+e.status+'</span>':''}
function describe(e,d){

    t='휴가'+statusPill(e);p=md(e.start)+' 08:30 ~ '+md(e.end)+' 21:00\n'+KINDS.filter(function(k){return c[k]}).map(function(k){return k+' '+c[k]+'일'}).join(' · ')+(e.days[d]?'\n이 날: '+e.days[d]+(e.gr&&e.gr[d]&&grantById(e.gr[d])?' ('+grantById(e.gr[d]).name+')':'')+(e.notes&&e.notes[d]?' · '+e.notes[d]:''):'')}

  else if(e.type==='hospital'){t='병원'+(e.dept?' · '+esc(e.dept):'');p=e.rxDays>0?'처방 '+e.rxDays+'일 ('+mdw(addDays(e.date,e.rxDays))+' 종료)':'처방 없음'}

function closeForm(){var was=!!(F||G);F=null;G=null;if(was)schedulePublish();document.getElementById('overlay').hidden=true}
function fillDefaults(){
  var d=F.anchor,t=F.type;
  if(t==='leave'){F.start=F.start||d;F.end=F.end||d;F.status=F.status||'희망';syncDays()}
  else if(t==='training'){F.start=F.start||d;F.end=F.end||d;F.details=F.details||{}}
  else if(t==='etc'){F.start=F.start||F.date||d;F.end=F.end||F.start;F.color=F.color||'blue'}
  else{F.date=F.date||d}
  if(t==='leave')F.gr=F.gr||{};
  if(t==='combat'&&!F.gr)F.gr=pickGrant('combat');
  if(t==='out'||t==='stay'){F.kind=F.kind||'정기';F.status=F.status||(F.editing?'확정':'희망')}
  if(t==='wout'||t==='combat')F.status=F.status||'희망';

function syncDays(){var old=F.days||{},n={};range(F.start,F.end).forEach(function(d){n[d]=old[d]||'연가'});F.days=n;F.gr=F.gr||{};for(var d in F.gr)if(!n[d])delete F.gr[d]}
function validate(){
  var t=F.type,id=F.id;
  if(!t)return '';

    if(F.end<F.start)return '종료일이 시작일보다 빠릅니다.';
    var taken={};S.events.forEach(function(e){if(e.type==='leave'&&e.id!==id)evDates(e).forEach(function(d){taken[d]=1})});
    for(var d in F.days)if(taken[d])return '이미 휴가가 등록된 날짜가 포함되어 있습니다. ('+md(d)+')';
    var c={};for(var k in F.days)c[F.days[k]]=(c[F.days[k]]||0)+1;
    if(c['연가']){if(usedLeave('연가',id)+c['연가']>24)return '남은 휴가가 없습니다.|연가 남은 '+Math.max(0,24-usedLeave('연가',id))+'일, 선택 '+c['연가']+'일.'}
    for(var i=1;i<KINDS.length;i++){var kd=KINDS[i];if(c[kd]){var er=grantCheck('leave:'+kd,id);
      if(er==='X')return grantsOf('leave:'+kd).length?kd+' 휴가 항목을 골라주세요.':'등록된 '+kd+' 휴가가 없습니다.|휴가·출타 관리 탭에서 보유 또는 예정에 추가하세요.';
      if(er.indexOf('LACK|')===0)return '남은 휴가가 없습니다.|'+er.slice(5);
      if(er.indexOf('PLAN|')===0)return '예정된 휴가는 희망으로만 등록할 수 있습니다.|'+er.slice(5)}}
  }
  if((t==='training'||t==='etc')&&F.end<F.start)return '종료일이 시작일보다 빠릅니다.';
  if(t==='wout'&&countWout(ym(F.date),id)>=2)return '남은 평일 외출이 없습니다.|'+(+F.date.slice(5,7))+'월에 이미 2번 등록되어 있습니다.';
  if(t==='combat'){var ec=grantCheck('combat',id);
    if(ec==='X')return '남은 전투휴무가 없습니다.|휴가·출타 관리 탭에서 보유 또는 예정에 추가하세요.';
    if(ec.indexOf('LACK|')===0)return '남은 전투휴무가 없습니다.|'+ec.slice(5);
    if(ec.indexOf('PLAN|')===0)return '예정된 전투휴무는 희망으로만 등록할 수 있습니다.|'+ec.slice(5)}
  if(t==='out'&&F.kind==='정기'){
    if(countReg('stay',ym,ym(F.date),id)>0)return '이번 달은 정기 외박으로 인하여 외출이 불가합니다.';
    if(countReg('out',quarter,quarter(F.date),id)>=2)return '남은 정기 외출이 없습니다.|이번 분기에 이미 2번 등록되어 있습니다.';
  }
  if((t==='out'||t==='stay')&&F.kind==='포상'){var eo=grantCheck('reward:'+t,id),nm='포상 '+TYPE_NAME[t];
    if(eo==='X')return '남은 '+nm+'이 없습니다.|휴가·출타 관리 탭에서 보유 또는 예정에 추가하세요.';
    if(eo.indexOf('LACK|')===0)return '남은 '+nm+'이 없습니다.|'+eo.slice(5);
    if(eo.indexOf('PLAN|')===0)return '예정된 '+nm+'은 희망으로만 등록할 수 있습니다.|'+eo.slice(5)}
  if(t==='stay'&&F.kind==='정기'){
    if(countReg('out',ym,ym(F.date),id)>0)return '이번 달은 정기 외출로 인하여 외박이 불가합니다.';
    if(countReg('stay',quarter,quarter(F.date),id)>=1)return '남은 정기 외박이 없습니다.|이번 분기에 이미 1번 등록되어 있습니다.';
  }
  return '';
}

  }
  if(el.id==='save-btn'){saveForm();return}

    if(ds.set==='type'){var keep={id:F.id,anchor:F.anchor,editing:false,type:ds.val};F=keep;fillDefaults()}
    else F[ds.set]=ds.val;

    renderForm();return}
  if(ds.day&&F){F.days[ds.day]=ds.val;F.gr=F.gr||{};if(ds.val==='연가')delete F.gr[ds.day];else F.gr[ds.day]=pickGrant('leave:'+ds.val,ds.day);renderForm();return}
  if(ds.delhol){S.customHolidays.splice(+ds.delhol,1);persist();render();return}
  if(el.id==='gh-save'){saveToken();return}
  if(el.id==='gh-off'){ghTok=null;try{localStorage.removeItem(GH_TK)}catch(e){}setRO(true);return}
  if(el.id==='share-copy'){var msg=document.getElementById('share-msg');
    encodeShare().then(function(url){var inp=document.getElementById('share-url');if(inp){inp.value=url;inp.select()}
      return navigator.clipboard.writeText(url).then(function(){msg.textContent='복사됨. 일정이 바뀌면 다시 복사해서 보내주세요.'},function(){msg.textContent='자동 복사가 안 됩니다. 위 칸을 길게 눌러 복사해주세요.'})}).catch(function(){msg.textContent='링크를 만들지 못했습니다.'});return}
  if(el.id==='hol-add'){var hd=document.getElementById('hol-date').value,hn=document.getElementById('hol-name').value.trim();
    if(hd){S.customHolidays.push({date:hd,name:hn||'공휴일'});S.customHolidays.sort(function(a,b){return a.date<b.date?-1:1});persist();render()}return}
});
document.getElementById('overlay').addEventListener('click',function(ev){if(ev.target===this)closeForm()});
document.addEventListener('input',function(ev){
  var el=ev.target,ds=el.dataset;
  if(G&&ds.g){G[ds.g]=el.value;var ge=document.getElementById('g-err');if(ge&&G.touched){var m=grantErr();ge.textContent=m;ge.hidden=!m}return}
  if(!F)return;
  if(ds.det){F.details[ds.det]=el.value;return}
  if(ds.note){F.notes=F.notes||{};F.notes[ds.note]=el.value;return}
  if(ds.f&&ds.f!=='end'){F[ds.f]=el.value;if(ds.f==='rxDays')rxNote();return}
});
document.addEventListener('change',function(ev){
  var el=ev.target,ds=el.dataset;
  if(el.id==='month-select'){ui.month=el.value;ui.sel=(ym(T)===ui.month)?T:ui.month+'-01';ui.delId=null;renderCalendar();return}
  if(F&&ds.f==='end'){if(el.value){F.end=el.value;if(F.type==='leave'&&F.end>=F.start)syncDays()}renderForm();return}
  if(ds.grday&&F){F.gr[ds.grday]=el.value;renderForm();return}
  if(ds.grone&&F){F.gr=el.value;renderForm();return}
  if(el.id==='set-enlist'&&el.value){S.settings.enlist=el.value;persist();render();return}
  if(el.id==='set-discharge'&&el.value){S.settings.discharge=el.value;persist();render();return}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&(F||G))closeForm();if(ev.key==='Enter'&&ev.target.id==='gh-token')saveToken()});

render();
if(GH){ghPull();if(/^#edit$/.test(location.hash)&&!ghTok)openToken()}
window.addEventListener('hashchange',function(){if(GH&&location.hash==='#edit'&&!ghTok)openToken()});
if(shareLoad)shareLoad.then(function(txt){S=normalize(JSON.parse(txt));render()}).catch(function(){});
if(restoreY)setTimeout(function(){window.scrollTo(0,restoreY)},50);
})();
</script>
</body>
</html>
